<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Santos de Melo · Suporte, sistemas e automação</title>
  <meta name="description" content="Portfólio de Wesley Santos de Melo: auxiliar de helpdesk e sistemas, aprendendo automação com n8n e programação. Fluxos que transformam tarefas manuais em processos automáticos.">
  <meta name="author" content="Wesley Santos de Melo">
  <meta name="theme-color" content="#060608">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Wesley Santos de Melo · Suporte, sistemas e automação">
  <meta property="og:description" content="Helpdesk e sistemas no dia a dia, automação com n8n e programação em estudo. Aprendendo a resolver problemas reais com processos que rodam sozinhos.">
  <style>
    /* ============ DESIGN TOKENS ============ */
    :root{
      --bg:#060608; --bg-soft:#0B0B0E; --surface:#101014; --surface-2:#17171C;
      --text:#F5F5F7; --text-2:rgba(245,245,247,.72); --text-3:rgba(245,245,247,.48);
      --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.055);
      --accent:#E0242E; --accent-2:#F0434D; --accent-deep:#8F0F18;
      --accent-soft:rgba(224,36,46,.12); --accent-glow:rgba(224,36,46,.35);
      --nav-bg:rgba(6,6,8,.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 10px 34px rgba(0,0,0,.5); --shadow-lg:0 26px 80px rgba(0,0,0,.6);
      --r-card:18px; --r-inner:12px; --r-pill:999px;
      --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif;
      --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      --max:1160px; --nav-h:64px;
      --ease:cubic-bezier(.16,1,.3,1);
    }
    /* ============ BASE ============ */
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
    body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5}
    ::selection{background:var(--accent);color:#fff}
    a{color:inherit} img{max-width:100%;display:block}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
    main{display:block;position:relative;z-index:1}
    section{padding:104px 0;position:relative}
    @media(max-width:768px){section{padding:72px 0}}
    .skip{position:absolute;left:16px;top:-60px;z-index:300;background:var(--accent);color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:600;text-decoration:none;transition:top .2s var(--ease)}
    .skip:focus{top:12px}
    :focus-visible{outline:2px solid var(--accent-2);outline-offset:3px;border-radius:6px}
    h1,h2,h3{letter-spacing:-.03em;line-height:1.04;margin:0;text-wrap:balance}
    h1{font-size:clamp(3rem,8vw,6.4rem);font-weight:800}
    h2{font-size:clamp(2rem,4.4vw,3.2rem);font-weight:800}
    h3{font-size:1.15rem;font-weight:650;line-height:1.25}
    p{margin:0}
    .lede{color:var(--text-2);font-size:clamp(1rem,1.4vw,1.15rem);line-height:1.7}
    .kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2)}
    .kicker::before{content:"";width:26px;height:1px;background:var(--accent-2)}
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(720px 380px at 50% -120px, rgba(224,36,46,.07), transparent 72%);}
    body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
      background-image:radial-gradient(rgba(255,255,255,.05) .6px, transparent .6px);background-size:26px 26px;
      -webkit-mask-image:radial-gradient(80% 60% at 50% 20%, #000 15%, transparent 85%);
      mask-image:radial-gradient(80% 60% at 50% 20%, #000 15%, transparent 85%)}
    /* ============ NAVBAR ============ */
    .nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:120;background:transparent;border-bottom:1px solid transparent;transition:background .35s var(--ease),border-color .35s,box-shadow .35s}
    .nav.scrolled{background:var(--nav-bg);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom-color:rgba(224,36,46,.22);box-shadow:0 8px 30px rgba(0,0,0,.35)}
    .nav-inner{max-width:var(--max);margin:0 auto;padding:0 24px;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
    .brand small{font-weight:500;color:var(--text-3)}
    .brand-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.35)}
    .nav-links{display:flex;align-items:center;gap:2px;list-style:none;margin:0;padding:0}
    .nav-links a{position:relative;text-decoration:none;font-size:14px;font-weight:500;color:var(--text-2);padding:9px 14px;border-radius:var(--r-pill);transition:color .2s}
    .nav-links a::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:2px;background:var(--accent-2);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
    .nav-links a:hover{color:var(--text)} .nav-links a:hover::after{transform:scaleX(1)}
    .nav-links a.active{color:#fff}
    .nav-links a.active::before{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent-2)}
    .nav-actions{display:flex;align-items:center;gap:8px}
    .menu-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:17px}
    .menu-btn:hover{border-color:var(--accent)}
    .mobile-panel{display:none}
    @media(max-width:820px){
      .nav-links{display:none} .menu-btn{display:inline-flex}
      .mobile-panel{display:block;position:fixed;top:calc(var(--nav-h) + 8px);left:12px;right:12px;z-index:110;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-lg);padding:8px;opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
      .mobile-panel.open{opacity:1;transform:none;pointer-events:auto}
      .mobile-panel a{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r-inner);text-decoration:none;font-size:16px;font-weight:600}
      .mobile-panel a:hover{background:var(--surface-2)}
      .mobile-panel a span:last-child{color:var(--accent-2);font-weight:600}
    }
    /* ============ BOTÕES ============ */
    .btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 30px;border-radius:var(--r-pill);font-size:15px;font-weight:650;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s,background .2s,border-color .2s,color .2s}
    .btn:active{transform:scale(.97)}
    .btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .btn-primary:hover{box-shadow:0 14px 34px rgba(0,0,0,.5);transform:translateY(-2px)}
    .btn-ghost{background:transparent;color:var(--text);border-color:var(--line)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
    .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
    /* ============ CURSOR ============ */
    .cursor{position:fixed;left:0;top:0;z-index:500;pointer-events:none;opacity:0;transition:opacity .3s}
    .cursor .ring{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent);transition:width .25s var(--ease),height .25s var(--ease),margin .25s var(--ease),opacity .25s,background .2s}
    .cursor.is-link .ring{width:30px;height:30px;margin:-15px 0 0 -15px;opacity:.75}
    .cursor.is-btn .ring{width:44px;height:44px;margin:-22px 0 0 -22px;opacity:.32;background:var(--accent-2)}
    .cursor.is-project .ring{width:72px;height:72px;margin:-36px 0 0 -36px;opacity:.92;background:rgba(224,36,46,.9)}
    .cursor .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.14em;color:#fff;opacity:0;transition:opacity .2s}
    .cursor.is-project .label{opacity:1}
    .cursor.is-down .ring{width:8px;height:8px;margin:-4px 0 0 -4px}
    .cursor .ripple{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--accent-2);opacity:0;transform:scale(1);pointer-events:none}
    .cursor .ripple.go{animation:ripple .5s var(--ease) both}
    @keyframes ripple{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(4.2)}}
    .has-cursor,.has-cursor *{cursor:none!important}
    .progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:200;background:linear-gradient(90deg,var(--accent-deep),var(--accent-2));transform:scaleX(0);transform-origin:0 50%}
    @supports (animation-timeline: scroll()){.progress{animation:prog linear both;animation-timeline:scroll()}@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}}
    /* ============ HERO ============ */
    .hero{min-height:100svh;display:flex;align-items:center;padding:calc(var(--nav-h) + 64px) 0 80px;position:relative;overflow:clip}
    .hero-bg{position:absolute;inset:0;pointer-events:none}
    .hero-bg .glow{position:absolute;width:640px;height:640px;left:50%;top:-18%;margin-left:-320px;border-radius:50%;background:radial-gradient(closest-side, var(--accent-glow), transparent 70%);filter:blur(40px);animation:glowPulse 7s ease-in-out infinite}
    @keyframes glowPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
    .hero-bg .grid{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 45%)}
    .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;position:relative}
    @media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:44px}}
    .status{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:var(--r-pill);padding:8px 16px 8px 12px;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:26px}
    .dot{width:8px;height:8px;border-radius:50%;background:#30D158;flex:none}
    .hero h1 .line{display:block;overflow:hidden}
    .hero h1 .chars{display:inline-block;will-change:transform,opacity,filter}
    .hero h1 .accent{color:var(--accent-2)}
    .hero h1 .hollow{color:transparent;-webkit-text-stroke:1.5px rgba(245,245,247,.55)}
    .hero h1 .u-sweep{position:relative;display:inline-block}
    .hero h1 .u-sweep::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.09em;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease) .9s}
    .hero.hero-go .u-sweep::after{transform:scaleX(1)}
    .hero-sub{margin-top:22px;color:var(--text-2);font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.7;max-width:48ch}
    .hero-sub strong{color:var(--accent-2)}
    .termline{font-family:var(--mono);font-size:13.5px;color:var(--text-2);margin-top:20px}
    .termline b{color:var(--accent-2);font-weight:600}
    .termline .caret{display:inline-block;width:8px;height:14px;background:var(--accent-2);vertical-align:-2px;margin-left:6px}
    @media (prefers-reduced-motion:no-preference){.termline .caret{animation:blink 1.15s steps(1) infinite}@keyframes blink{50%{opacity:0}}}
    .hero-meta{display:flex;gap:26px;margin-top:30px;flex-wrap:wrap}
    .hero-meta div{display:flex;flex-direction:column}
    .hero-meta strong{font-size:15px}
    .hero-meta span{font-size:13px;color:var(--text-3)}
    .scroll-hint{margin-top:48px;display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:13px}
    .mouse{width:22px;height:34px;border:1.5px solid var(--text-3);border-radius:12px;position:relative;opacity:.7}
    .mouse::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:3px;background:var(--text-3)}
    @media (prefers-reduced-motion:no-preference){.hero-visual{animation:floaty 7s ease-in-out infinite}}
    @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .hero-visual{display:grid;gap:16px;position:relative;isolation:isolate}
    .hero-visual::before{content:"";position:absolute;inset:6% -6% -8%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side, var(--accent-soft), transparent);filter:blur(46px)}
    .window{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-lg);overflow:hidden}
    .window-bar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
    .traffic{display:flex;gap:7px}
    .traffic i{width:11px;height:11px;border-radius:50%;display:block}
    .traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}
    .window-bar code{font-family:var(--mono);font-size:12px;color:var(--text-3);margin-left:6px}
    .code{padding:18px 20px;font-family:var(--mono);font-size:12.8px;line-height:1.75;overflow-x:auto}
    .code .k{color:var(--accent-2)} .code .s{color:#7DDC8A} .code .f{color:var(--text)} .code .c{color:var(--text-3)}
    .hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:480px){.hero-cards{grid-template-columns:1fr}}
    .mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
    .mini:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(224,36,46,.45)}
    .mini h3{font-size:12px;font-family:var(--mono);font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
    .bars{display:flex;align-items:flex-end;gap:6px;height:56px}
    .bars i{flex:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-soft);min-height:8px}
    .bars i.fill{background:linear-gradient(180deg,var(--accent-2),var(--accent-deep));border-color:transparent;transform-origin:bottom}
    @media (prefers-reduced-motion:no-preference){.bars i.fill{animation:grow .9s var(--ease) both}.bars i.fill:nth-child(2){animation-delay:.15s}.bars i.fill:nth-child(4){animation-delay:.3s}.bars i.fill:nth-child(6){animation-delay:.45s}@keyframes grow{from{transform:scaleY(.3)}to{transform:scaleY(1)}}}
    .check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
    .check:last-child{border-bottom:0}
    .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;background:var(--surface)}
    .box.done{background:var(--accent);border-color:var(--accent);color:#fff}
    .check s{color:var(--text-3)}
    /* hero entrance */
    .hero [data-hero]{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
    .hero.hero-go [data-hero]{opacity:1;transform:none}
    .hero [data-d="1"]{transition-delay:.06s}.hero [data-d="2"]{transition-delay:.2s}.hero [data-d="3"]{transition-delay:.34s}.hero [data-d="4"]{transition-delay:.48s}.hero [data-d="5"]{transition-delay:.62s}.hero [data-d="6"]{transition-delay:.78s}.hero [data-d="7"]{transition-delay:.92s}
    /* ============ INTRO / IDENTIDADE ============ */
    .intro{border-top:1px solid var(--line-soft)}
    .intro-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
    @media(max-width:860px){.intro-grid{grid-template-columns:1fr;gap:28px}}
    .intro-big{font-size:clamp(1.5rem,2.6vw,2.3rem);line-height:1.35;letter-spacing:-.02em;font-weight:600}
    .intro-big em{font-style:normal;color:var(--accent-2)}
    .intro-sub{margin-top:20px;color:var(--text-2);max-width:60ch}
    .portrait{background:none;border:0;box-shadow:none;padding:8px 0;position:sticky;top:calc(var(--nav-h) + 20px);align-self:start}
    @media(max-width:860px){.portrait{position:static}}
    .photo-frame{position:relative;width:288px;height:288px;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 0 0 1px rgba(224,36,46,.18), var(--shadow-md)}
    .photo-frame::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
    .photo-frame img{width:100%;height:100%;object-fit:cover}
    .portrait h3{margin:18px 0 4px;font-size:19px}
    .portrait p.role{color:var(--text-3);font-size:14px;margin-bottom:16px}
    .facts{list-style:none;margin:20px 0 0;padding:20px 0 0;border-top:1px solid var(--line-soft);display:grid;gap:12px;font-size:14px;color:var(--text-2)}
    .facts li{display:flex;gap:10px;align-items:flex-start}
    .facts b{color:var(--text)}
    /* ============ VALUES ============ */
    .values{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
    @media(max-width:520px){.values{grid-template-columns:1fr}}
    .value{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-inner);padding:18px;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
    .value:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(224,36,46,.45)}
    .value span{display:inline-flex;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);align-items:center;justify-content:center;font-size:17px}
    .value h3{font-size:15px;margin:10px 0 6px}
    .value p{font-size:14px;color:var(--text-2);line-height:1.6}
    /* ============ STACK / SKILLS ============ */
    .skills{background:var(--bg-soft);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);overflow:clip}
    .skills::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(620px 230px at 50% 0, var(--accent-soft), transparent 70%)}
    .skills>.wrap{position:relative}
    .skills-head{max-width:640px}
    .stack{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;list-style:none;padding:0}
    .chip{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:10px 18px 10px 12px;font-size:14px;font-weight:600;cursor:default;transition:transform .25s var(--ease),border-color .2s,box-shadow .25s,background .2s}
    .chip:hover{transform:translateY(-3px) scale(1.02);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.35);background:#151017}
    .chip i{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;transition:transform .3s var(--ease-spring,cubic-bezier(.34,1.56,.64,1))}
    .chip:hover i{transform:rotate(-12deg) scale(1.12)}
    .chip small{font-weight:500;color:var(--text-3);font-size:12px}
    .learn{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
    @media(max-width:760px){.learn{grid-template-columns:1fr}}
    .learn article{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r-inner);padding:22px;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
    .learn article:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(224,36,46,.4)}
    .learn h3{font-size:13px;font-family:var(--mono);font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
    .learn p{font-size:14px;color:var(--text-2)}
    .note{margin-top:18px;font-size:13.5px;color:var(--text-3)}
    /* ============ PROJETOS ============ */
    .proj-list{display:grid;gap:28px;margin-top:44px}
    .proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .4s var(--ease),box-shadow .4s,border-color .3s;position:relative}

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    /* ---------- DADOS ---------- */
    const SKILLS = [

                <a href="#skills" onClick={() => setMenuOpen(false)}>Stack <span>→</span></a>

const hoje = new Date();
const limite = new Date(hoje.getTime() + 7 * 864e5);

return lista
  .filter(c => {
    const vence = new Date(c.validade);
    return vence >= hoje && vence <= limite;
  })
  .map(c => ({ json: { nome: c.nomeAmigavel } }));`}</pre>

                      <div className="mini">

                    </div>

                      </Reveal>
                      <div className="values">
                        {[
                          { e: "⟳", t: "Automação de processos", d: "Tirar tarefas repetitivas do caminho e deixar o fluxo rodar sozinho." },

                          { e: "◍", t: "Lógica e clareza", d: "Regras explícitas, exceções tratadas e nomes que qualquer pessoa entende." },
                          { e: "✎", t: "Aprendizado contínuo", d: "JavaScript e fundamentos, evoluindo a cada automação que construo." },
                        ].map((v, i) => (
                          <Reveal key={v.t} delay={i * 70}><div className="value"><span aria-hidden="true">{v.e}</span><h3>{v.t}</h3><p>{v.d}</p></div></Reveal>

            <footer>

                <span>© 2026 Wesley Santos de Melo · Feito com React em um único HTML · <span className="sys">● online</span></span>

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
