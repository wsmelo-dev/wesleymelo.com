<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Melo - Helpdesk, sistemas e automação</title>
  <meta name="description" content="Portfólio de Wesley Melo: auxiliar de helpdesk e sistemas, aprendendo automação com n8n e programação.">
  <meta name="author" content="Wesley Melo">
  <meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0C0D" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Wesley Melo - Helpdesk, sistemas e automação">
  <meta property="og:description" content="Helpdesk e sistemas no dia a dia, automação com n8n e programação em estudo.">
  <script>try{var t=localStorage.getItem("wsm.theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- ============================================================
    PORTFÓLIO · Wesley Melo · direção editorial monocromática
    Um único index.html. Sem Node, sem build, sem npm.
    CDN: React 18 + ReactDOM + Babel + Geist (com fallback de sistema).
    Ordem: Tokens → Base → Componentes → Dados → App
    Sistema: preto e branco. Sem cor decorativa. Um único acento
    (verde de status) usado como sinal, nunca como enfeite.
    Formato: 0px de raio em superfícies, pílula só em etiquetas.
  ============================================================ -->
  <style>
    /* ============ TOKENS ============ */
    :root{
      --paper:#F2F2F0; --paper-2:#E9E9E6; --paper-3:#E0E0DC;
      --surface:#FAFAF8;
      --ink:#0C0C0D; --ink-2:#43434A; --ink-3:#76767E;
      --line:rgba(12,12,13,.16); --line-soft:rgba(12,12,13,.09); --line-hard:rgba(12,12,13,.5);
      --inv-bg:#0C0C0D; --inv-ink:#F2F2F0;
      --status:#2E7D5B;
      --font:"Geist","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --ease:cubic-bezier(.16,1,.3,1);
      --max:1180px; --nav-h:60px;
      --shadow:0 1px 2px rgba(12,12,13,.05);
    }
    [data-theme="dark"]{
      --paper:#0C0C0D; --paper-2:#151517; --paper-3:#1E1E21;
      --surface:#131315;
      --ink:#F1F1EE; --ink-2:#B4B4B8; --ink-3:#82828A;
      --line:rgba(241,241,238,.18); --line-soft:rgba(241,241,238,.10); --line-hard:rgba(241,241,238,.6);
      --inv-bg:#F1F1EE; --inv-ink:#0C0C0D;
      --status:#5FBE92;
      --shadow:0 1px 2px rgba(0,0,0,.5);
    }

    /* ============ BASE ============ */
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 20px)}
    body{
      margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5;
      transition:background-color .4s var(--ease),color .4s var(--ease);
      animation:fade .35s var(--ease) both;overflow-x:clip;
    }
    @keyframes fade{from{opacity:0}to{opacity:1}}
    ::selection{background:var(--ink);color:var(--paper)}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
    .skip{position:absolute;left:14px;top:-60px;z-index:400;background:var(--inv-bg);color:var(--inv-ink);
      padding:10px 18px;font-size:14px;font-weight:600;text-decoration:none;transition:top .2s var(--ease)}
    .skip:focus{top:12px}
    h1,h2,h3{letter-spacing:-.035em;line-height:1.04;margin:0;font-weight:600}
    p{margin:0}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 28px}
    .mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
    .rule{height:1px;background:var(--line);transform-origin:0 50%}
    .lede{color:var(--ink-2);font-size:clamp(1rem,1.35vw,1.08rem);line-height:1.7;max-width:64ch}

    /* ============ FUNDO (malha técnica, sem brilho) ============ */
    .mesh{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
      background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
      background-size:28px 28px;
      -webkit-mask-image:radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 62%);
      mask-image:radial-gradient(120% 80% at 50% 0%, #000 0%, transparent 62%)}
    .site{position:relative;z-index:1}

    /* ============ NAV ============ */
    .nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:100;
      background:var(--paper);border-bottom:1px solid transparent;transition:border-color .3s var(--ease)}
    .nav.scrolled{border-bottom-color:var(--line-soft)}
    .nav-in{max-width:var(--max);margin:0 auto;padding:0 28px;height:var(--nav-h);
      display:flex;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
    .brand-mark{width:26px;height:26px;flex:none;border:1px solid var(--line-hard);display:inline-flex;
      align-items:center;justify-content:center;font-size:10.5px;font-weight:600;letter-spacing:.02em;
      transition:background .25s var(--ease),color .25s}
    .brand:hover .brand-mark{background:var(--inv-bg);color:var(--inv-ink)}
    .links{display:flex;gap:2px;list-style:none;margin:0;padding:0}
    .links a{text-decoration:none;font-size:13.5px;font-weight:450;color:var(--ink-2);padding:7px 13px;
      border-radius:2px;position:relative;transition:color .2s}
    .links a::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:1px;background:currentColor;
      transform:scaleX(0);transform-origin:0 50%;transition:transform .3s var(--ease)}
    .links a:hover{color:var(--ink)}
    .links a:hover::after{transform:scaleX(1)}
    .nav-act{margin-left:auto;display:flex;align-items:center;gap:8px}
    .tgl{border:1px solid var(--line);background:none;color:var(--ink);width:34px;height:34px;cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s,border-color .2s}
    .tgl:hover{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
    .burger{display:none}
    .m-panel{display:none}
    @media(max-width:720px){
      .links{display:none}
      .burger{display:inline-flex}
      .m-panel{display:block;position:fixed;top:var(--nav-h);left:16px;right:16px;z-index:99;
        background:var(--surface);border:1px solid var(--line);padding:6px;
        opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease)}
      .m-panel.open{opacity:1;transform:none;pointer-events:auto}
      .m-panel a{display:flex;justify-content:space-between;padding:13px 14px;text-decoration:none;font-size:15px;font-weight:500}
      .m-panel a:hover{background:var(--paper-2)}
      .m-panel a span:last-child{color:var(--ink-3);font-family:var(--mono);font-size:11px}
    }

    /* ============ BOTÕES (formato técnico, sem raio) ============ */
    .btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 24px;
      font-size:14.5px;font-weight:550;text-decoration:none;cursor:pointer;border:1px solid transparent;
      border-radius:2px;white-space:nowrap;
      transition:background .22s var(--ease),color .22s,border-color .22s,transform .18s var(--ease)}
    .btn:active{transform:translateY(1px)}
    .btn-p{background:var(--inv-bg);color:var(--inv-ink)}
    .btn-p:hover{opacity:.86}
    .btn-g{background:none;color:var(--ink);border-color:var(--line)}
    .btn-g:hover{border-color:var(--ink)}
    .btn .arw{transition:transform .25s var(--ease)}
    .btn:hover .arw{transform:translateX(3px)}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}

    /* ============ HERO (split editorial) ============ */
    .hero{padding:calc(var(--nav-h) + 64px) 0 0;position:relative}
    .hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:64px;align-items:end}
    @media(max-width:940px){.hero-grid{grid-template-columns:1fr;gap:44px;align-items:start}}
    .kicker{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .kicker .dot{width:7px;height:7px;background:var(--status);border-radius:50%;flex:none}
    .hero h1{font-size:clamp(3.2rem,9vw,6.2rem);font-weight:600;letter-spacing:-.05em;line-height:.94}
    .hero h1 .l2{display:block;color:var(--ink-3)}
    .role{margin-top:24px;font-size:clamp(1rem,1.6vw,1.15rem);color:var(--ink);font-weight:500}
    .hero .lede{margin-top:12px;max-width:48ch}
    /* revelação por palavra (transform + opacity, sem recorte de glifos) */
    .mask{display:block}
    .mask .w{display:inline-block}
    .mask .wi{display:inline-block;transform:translateY(.42em);opacity:0;
      transition:transform .85s var(--ease),opacity .6s var(--ease)}
    .mask.in .wi{transform:none;opacity:1}
    .hero .mask .wi{transition-delay:calc(var(--i) * 55ms + 60ms)}
    .hero h1 .mask + .mask{margin-top:-.06em}

    /* painel de leitura (dado real, não enfeite) */
    .panel{border:1px solid var(--line);background:var(--surface);padding:22px 22px 18px}
    .panel-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
    .panel dl{margin:0;display:grid;gap:0}
    .panel dl > div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
      padding:11px 0;border-bottom:1px solid var(--line-soft)}
    .panel dl > div:last-child{border-bottom:0;padding-bottom:4px}
    .panel dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
    .panel dd{margin:0;font-size:13.5px;font-weight:500;text-align:right}
    .clock{font-family:var(--mono);font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
    .orbit{position:absolute;right:-8%;top:6%;width:min(420px,52vw);aspect-ratio:1;pointer-events:none;opacity:.5}
    .orbit .ring{fill:none;stroke:var(--line);stroke-width:1}
    .orbit .ring.dash{stroke-dasharray:2 7}
    .orbit .body{fill:var(--ink)}
    @media (prefers-reduced-motion:no-preference){
      .orbit .body{animation:orbit 26s linear infinite;transform-origin:center}
      @keyframes orbit{to{transform:rotate(360deg)}}
    }
    .strip{margin-top:64px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
      overflow:hidden;padding:13px 0}
    .strip-track{display:flex;gap:44px;width:max-content;animation:slide 46s linear infinite}
    .strip:hover .strip-track{animation-play-state:paused}
    .strip span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
    .strip span::before{content:"- ";color:var(--line-hard)}
    @keyframes slide{to{transform:translateX(-50%)}}
    @media (prefers-reduced-motion:no-preference){
      .strip-track{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
        mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
    }

    /* ============ ESTRUTURA DE SEÇÃO ============ */
    section{padding:104px 0;position:relative}
    @media(max-width:768px){section{padding:68px 0}}
    .sec{display:grid;grid-template-columns:132px 1fr;gap:40px;align-items:start}
    @media(max-width:860px){.sec{grid-template-columns:1fr;gap:22px}}
    .sec-num{font-family:var(--mono);font-size:44px;line-height:1;color:var(--paper-3);
      letter-spacing:-.04em;user-select:none}
    [data-theme="dark"] .sec-num{color:#1C1C1F}
    .sec h2{font-size:clamp(1.9rem,4vw,3rem);font-weight:600;letter-spacing:-.04em}
    .sec-head{margin-bottom:44px}
    .sec-head .lede{margin-top:16px}

    /* ============ SOBRE ============ */
    .about{display:grid;grid-template-columns:1fr;gap:0}
    .principles{margin-top:34px;border-top:1px solid var(--line)}
    .principles li{list-style:none;display:grid;grid-template-columns:56px 1fr;gap:20px;padding:20px 0;
      border-bottom:1px solid var(--line-soft);transition:background .3s var(--ease)}
    .principles li:hover{background:var(--surface)}
    .principles b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3);padding-top:4px}
    .principles h3{font-size:1.02rem;font-weight:550;margin-bottom:5px}
    .principles p{font-size:14px;color:var(--ink-2);line-height:1.6;max-width:56ch}

    /* ============ SKILLS (filtro real + níveis honestos) ============ */
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
    .fchip{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
      border:1px solid var(--line);background:none;color:var(--ink-2);padding:8px 14px;border-radius:2px;
      cursor:pointer;transition:background .2s,color .2s,border-color .2s}
    .fchip:hover{border-color:var(--ink);color:var(--ink)}
    .fchip[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
    .skills-list{border-top:1px solid var(--line)}
    .skill{display:grid;grid-template-columns:52px 1.1fr 1.4fr 132px;gap:24px;align-items:center;
      padding:18px 12px;border-bottom:1px solid var(--line-soft);transition:background .28s var(--ease)}
    .skill:hover{background:var(--surface)}
    @media(max-width:860px){.skill{grid-template-columns:40px 1fr;gap:6px 14px;padding:16px 4px}
      .skill .s-cat{grid-column:2}.skill .s-meter{grid-column:2}}
    .skill .s-idx{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
    .skill .s-name{font-size:15.5px;font-weight:550}
    .skill .s-cat{font-size:13.5px;color:var(--ink-2)}
    .skill .s-meter{display:flex;align-items:center;gap:10px;justify-content:flex-end}
    .ticks{display:flex;gap:3px}
    .ticks i{width:16px;height:3px;background:var(--paper-3);display:block}
    [data-theme="dark"] .ticks i{background:#2A2A2E}
    .ticks i.on{background:var(--ink)}
    .skill .s-state{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
      white-space:nowrap}
    .skill.hidden{display:none}

    /* ============ PROJETOS (índice editorial) ============ */
    .proj{border-top:1px solid var(--line)}
    .proj-row{display:grid;grid-template-columns:64px 1fr 300px;gap:34px;align-items:start;
      padding:38px 12px;border-bottom:1px solid var(--line-soft);position:relative;
      transition:background .3s var(--ease)}
    .proj-row:hover{background:var(--surface)}
    @media(max-width:980px){.proj-row{grid-template-columns:48px 1fr;gap:6px 20px;padding:30px 4px}
      .proj-row .p-vis{grid-column:2;margin-top:20px;max-width:420px}}
    .p-idx{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:5px}
    .p-name{font-size:1.45rem;font-weight:600;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
    .p-name .arrow{opacity:0;transform:translateX(-6px);transition:opacity .25s var(--ease),transform .25s var(--ease)}
    .proj-row:hover .p-name .arrow{opacity:1;transform:none}
    .p-desc{margin-top:10px;font-size:14.5px;color:var(--ink-2);line-height:1.65;max-width:56ch}
    .p-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
    .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
      border:1px solid var(--line);color:var(--ink-2);padding:5px 10px;border-radius:2px}
    .tag.concept{border-color:var(--line-hard);color:var(--ink)}
    .p-link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13.5px;font-weight:550;
      color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-hard);padding-bottom:3px;
      transition:gap .25s var(--ease),border-color .2s}
    .p-link:hover{gap:12px;border-color:var(--ink)}
    .p-vis{border:1px solid var(--line);background:var(--surface);overflow:hidden;transition:transform .4s var(--ease)}
    .proj-row:hover .p-vis{transform:translateY(-3px)}
    .vis-bar{display:flex;align-items:center;gap:5px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
    .vis-bar i{width:7px;height:7px;background:var(--line);display:block}
    .vis-bar span{margin-left:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3)}
    .vis-body{padding:16px}
    .v-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;
      padding:8px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-2)}
    .v-row:last-child{border-bottom:0}
    .v-row b{font-weight:550;color:var(--ink)}
    .v-bars{display:flex;align-items:flex-end;gap:5px;height:46px;margin-bottom:12px}
    .v-bars i{flex:1;background:var(--paper-3);min-height:6px}
    .v-bars i.on{background:var(--ink)}
    [data-theme="dark"] .v-bars i{background:#2A2A2E}
    .v-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .v-col{border:1px solid var(--line-soft);padding:8px;min-height:66px}
    .v-col h5{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
      margin:0 0 7px;font-weight:400}
    .v-col span{display:block;height:5px;background:var(--paper-3);margin-bottom:5px}
    [data-theme="dark"] .v-col span{background:#2A2A2E}
    .v-col span.on{background:var(--ink)}
    .v-hero{text-align:center;padding:18px 14px 20px}
    .v-hero b{display:block;font-size:14px;letter-spacing:-.02em;margin-bottom:6px}
    .v-hero p{font-size:11.5px;color:var(--ink-3);margin-bottom:12px}
    .v-hero em{display:inline-block;font-style:normal;font-size:11.5px;font-weight:550;
      border:1px solid var(--line-hard);padding:6px 16px}

    /* ============ CONTATO ============ */
    .contact-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);margin-top:40px}
    @media(max-width:720px){.contact-list{grid-template-columns:1fr}}
    .c-item{padding:26px 22px 26px 0;border-bottom:1px solid var(--line-soft);text-align:left;
      background:none;border:0;font:inherit;color:inherit;cursor:pointer;width:100%;
      transition:background .28s var(--ease)}
    .c-item:hover{background:var(--surface)}
    .c-item .c-ic{width:34px;height:34px;border:1px solid var(--line);display:inline-flex;align-items:center;
      justify-content:center;margin-bottom:16px;transition:background .25s,color .25s,border-color .25s}
    .c-item:hover .c-ic{background:var(--inv-bg);color:var(--inv-ink);border-color:var(--inv-bg)}
    .c-item .c-ic svg{width:17px;height:17px}
    .c-item b{display:block;font-size:15px;font-weight:550;margin-top:2px}
    .c-item small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px;word-break:break-all}
    .c-item[aria-disabled="true"]{cursor:default;color:var(--ink-3)}
    .c-item[aria-disabled="true"]:hover{background:none}
    .c-item[aria-disabled="true"] .c-ic{opacity:.4}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;
      background:var(--inv-bg);color:var(--inv-ink);font-size:13.5px;font-weight:500;
      padding:12px 22px;border-radius:2px;box-shadow:0 8px 30px rgba(12,12,13,.2);
      max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      animation:toastIn .3s var(--ease) both}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

    /* ============ RODAPÉ ============ */
    footer{border-top:1px solid var(--line);padding:26px 0;position:relative;z-index:1}
    .foot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3)}
    .foot .grow{flex:1}
    .foot a,.foot button{color:var(--ink-3);text-decoration:none;background:none;border:0;font-size:12.5px;
      cursor:pointer;padding:4px 0;font-family:inherit}
    .foot a:hover,.foot button:hover{color:var(--ink)}
    .foot .status{color:var(--status)}

    /* ============ REVEAL ============ */
    .rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
    .rv.in{opacity:1;transform:none}
    .rule.in{transform:scaleX(1)}
    .rule{transform:scaleX(0);transition:transform 1.1s var(--ease)}

          throw new Error("sem clipboard");
        }catch(e1){
          try{
            const ta = document.createElement("textarea");
            ta.value = EMAIL; ta.setAttribute("readonly","");
            ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
            document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,9999);
            const ok = document.execCommand("copy"); document.body.removeChild(ta);
            if(!ok) throw new Error("exec falhou");
            done();
          }catch(e2){
            const f = document.getElementById("email-fallback");
            if(f){ f.hidden = false; f.focus(); f.select(); }
            setToast("Selecione o e-mail e pressione Ctrl+C");
            setTimeout(()=>setToast(""),4000);
          }
        }
      };

      return (
        <React.Fragment>
          <div className="mesh" aria-hidden="true"/>
          <div className="progress" aria-hidden="true"/>

          <header className={"nav"+(scrolled?" scrolled":"")}>
            <div className="nav-in">
              <a className="brand" href="#inicio" aria-label="Wesley Melo, início">
                <span className="brand-mark" aria-hidden="true">WM</span>Wesley Melo
              </a>
              <nav aria-label="Navegação principal">
                <ul className="links">
                  <li><a href="#sobre">Sobre</a></li>
                  <li><a href="#skills">Habilidades</a></li>
                  <li><a href="#projetos">Projetos</a></li>
                  <li><a href="#certificados">Certificados</a></li>
                  <li><a href="#contato">Contato</a></li>
                </ul>
              </nav>
              <div className="nav-act">
                <button type="button" className="tgl" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}
                  aria-label={theme==="light"?"Ativar modo escuro":"Ativar modo claro"} title={theme==="light"?"Modo escuro":"Modo claro"}>
                  {theme==="light" ? <Icon d={P.moon} s={16}/> : <Icon d={P.sun} s={16}/>}
                </button>
                <button ref={menuBtnRef} type="button" className="tgl burger" onClick={()=>setMenuOpen(v=>!v)}
                  aria-expanded={menuOpen} aria-controls="menu-mobile" aria-label={menuOpen?"Fechar menu":"Abrir menu"}>
                  {menuOpen?"✕":"☰"}
                </button>
              </div>
            </div>
          </header>

          <div id="menu-mobile" className={"m-panel"+(menuOpen?" open":"")} hidden={!menuOpen}>
            <nav aria-label="Navegação móvel">
              {[["sobre","Sobre","01"],["skills","Habilidades","02"],["projetos","Projetos","03"],["certificados","Certificados","04"],["contato","Contato","05"]].map(([id,l,n])=>(
                <a key={id} href={"#"+id} onClick={()=>setMenuOpen(false)}>{l}<span>{n}</span></a>
              ))}
            </nav>
          </div>

          <div className="site">
          <main id="conteudo">
            {/* ===== HERO ===== */}
            <section className="hero" id="inicio" aria-labelledby="hero-title">
              <div className="wrap">
                <div className="hero-grid">
                  <div>
                    <p className="kicker"><span className="dot" aria-hidden="true"/><span className="mono">Atuo em helpdesk e sistemas · automação em estudo</span></p>
                    <h1 id="hero-title">
                      <MaskTitle as="span" text="Wesley" className="l1"/>
                      <MaskTitle as="span" text="Melo" className="l2"/>
                    </h1>
                    <p className="role">Auxiliar de helpdesk e sistemas</p>
                    <p className="lede">Trabalho com suporte e sistemas e uso automação com n8n para tirar tarefas repetitivas do caminho. Estudo programação para construir soluções cada vez mais completas.</p>
                    <div className="btn-row">
                      <a className="btn btn-p" href="#projetos">Ver projetos <span className="arw" aria-hidden="true">↓</span></a>
                      <a className="btn btn-g" href="#contato">Entrar em contato <span className="arw" aria-hidden="true">→</span></a>
                    </div>
                  </div>

                  <aside className="panel" aria-label="Resumo do perfil">
                    <div className="panel-h">
                      <span className="mono">Ficha</span>
                      <span className="clock">{clock}</span>
                    </div>
                    <dl>
                      <div><dt>Foco</dt><dd>Automação com n8n</dd></div>
                      <div><dt>Base</dt><dd>Helpdesk e sistemas</dd></div>
                      <div><dt>Estudando</dt><dd>Programação</dd></div>
                      <div><dt>Projetos</dt><dd>{PROJECTS.length} no portfólio</dd></div>
                      <div><dt>Interesse</dt><dd>Automação e dados</dd></div>
                    </dl>
                  </aside>
                </div>

                <div className="strip" aria-hidden="true">
                  <div className="strip-track">
                    {TICKER.concat(TICKER).map((t,i)=>(<span key={i}>{t}</span>))}
                  </div>
                </div>
              </div>
              <svg className="orbit" viewBox="0 0 200 200" aria-hidden="true">
                <circle className="ring" cx="100" cy="100" r="96"/>
                <circle className="ring dash" cx="100" cy="100" r="68"/>
                <g className="body"><circle cx="196" cy="100" r="2.6"/></g>
              </svg>
            </section>

            {/* ===== SOBRE ===== */}
            <section id="sobre" aria-labelledby="sobre-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">01</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text="Sobre mim" id="sobre-title"/>
                      <p className="lede">Sou o Wesley. Gosto de tecnologia, de entender como as coisas funcionam por dentro e de resolver problemas do dia a dia com automação.</p>
                    </div>
                    <div className="about">
                      <div>
                        <p className="lede">Atuo em helpdesk e sistemas e comecei a automatizar processos repetitivos com n8n: fluxos que consultam dados, aplicam regras e enviam o resultado para quem precisa. Também estudo programação, com HTML, CSS e JavaScript, para entender o que acontece por trás de cada etapa.</p>
                        <p className="lede" style={{marginTop:"16px"}}>Estou no começo da carreira em tecnologia e prefiro dizer isso com clareza: o que trago é método, curiosidade e vontade de resolver problemas de verdade. Cada automação que construo é também uma chance de aprender algo novo.</p>
                        <ol className="principles">
                          {PRINCIPLES.map((p,i)=>(
                            <Reveal as="li" key={p.t} delay={i*70}>
                              <b>0{i+1}</b>
                              <div><h3>{p.t}</h3><p>{p.d}</p></div>
                            </Reveal>
                          ))}
                        </ol>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== HABILIDADES ===== */}
            <section id="skills" aria-labelledby="skills-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">02</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text="Habilidades" id="skills-title"/>
                      <p className="lede">O que já uso no dia a dia e o que estou aprofundando. Os níveis são uma autoavaliação honesta, não um número inventado.</p>
                    </div>
                    <Rule/>
                    <div className="filters" role="group" aria-label="Filtrar habilidades por categoria">
                      {cats.map(c=>(
                        <button key={c} type="button" className="fchip" aria-pressed={filter===c} onClick={()=>setFilter(c)}>
                          {c==="todos" ? "Todas" : c}
                        </button>
                      ))}
                    </div>
                    <div className="skills-list">
                      {shown.map((s,i)=>(
                        <Reveal className="skill" key={s.n} delay={Math.min(i*45,320)}>
                          <span className="s-idx">{String(i+1).padStart(2,"0")}</span>
                          <span className="s-name">{s.n}</span>
                          <span className="s-cat">{s.cat}</span>
                          <span className="s-meter">
                            <span className="s-state">{s.state}</span>
                            <span className="ticks" role="img" aria-label={"Nível autoavaliado: " + s.lvl + " de 4"}>
                              {[0,1,2,3].map(k=>(<i key={k} className={k<s.lvl?"on":""}/>))}
                            </span>
                          </span>
                        </Reveal>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== PROJETOS ===== */}
            <section id="projetos" aria-labelledby="projetos-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">03</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text="Projetos" id="projetos-title"/>
                      <p className="lede">Uma automação que está em uso no dia a dia, criada para resolver um problema real e tirar uma tarefa manual do caminho.</p>
                    </div>
                    <div className="proj">
                      {PROJECTS.map((p,i)=>(
                        <Reveal className="proj-row" key={p.name} delay={i*60}>
                          <span className="p-idx">{String(i+1).padStart(2,"0")}</span>
                          <div>
                            <h3 className="p-name">{p.name}<span className="arrow" aria-hidden="true">→</span></h3>
                            <p className="p-desc">{p.desc}</p>
                            <div className="p-meta">
                              <span className="tag concept">{p.badge || "Demonstrativo"}</span>
                              {p.tech.map(t=>(<span className="tag" key={t}>{t}</span>))}
                            </div>
                            {p.demo
                              ? <a className="p-link" href={p.demo} aria-label={"Abrir demonstração de "+p.name}>
                                  Abrir demonstração <span aria-hidden="true">↗</span>
                                </a>
                              : p.case
                                ? <a className="p-link" href={p.case}>Ver estudo de caso <span aria-hidden="true">↓</span></a>
                                : <p className="p-desc" style={{marginTop:"16px",color:"var(--ink-3)",fontSize:"13.5px"}}>Fluxo de uso interno, sem demonstração pública.</p>}
                          </div>
                          <div className="p-vis"><Preview type={p.vis}/></div>
                        </Reveal>
                      ))}
                    </div>
                    <Reveal delay={80}>
                      <p className="lede" style={{marginTop:"28px",fontSize:"14px"}}>
                        Novos projetos entram por aqui conforme avanço. Mais trabalhos ficam no meu perfil do GitHub.
                      </p>
                    </Reveal>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== ESTUDO DE CASO: AUTOMAÇÃO DE CERTIFICADOS ===== */}
            <section id="certificados" aria-labelledby="case-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">04</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text="Automação de Certificados Pix" id="case-title"/>
                      <p className="lede">Uma automação em uso real: do primeiro erro de dados até um aviso que chega no celular de quem precisa agir. Tudo descrito sem nomes de empresas, sistemas ou dados reais.</p>
                      <div className="case-tags" style={{marginTop:"18px"}}>
                        {CASE_TAGS.map(t=>(<span className="tag" key={t}>{t}</span>))}
                      </div>
                    </div>

                    {/* Visão geral */}
                    <div className="case-block" style={{marginTop:"0"}}>
                      <h3>Visão geral</h3>
                      <div className="case-lead">
                        <div>
                          <p className="lede">Acompanhar o vencimento de certificados digitais ligados ao Pix era uma tarefa manual: alguém precisava consultar a lista e lembrar de avisar antes do prazo. Quando o aviso não saía, o risco não era só perder a data, era perder a janela para agir.</p>
                          <p className="lede" style={{marginTop:"16px"}}>A proposta foi transformar esse acompanhamento em um fluxo automático que roda todos os dias, consulta a fonte de dados, verifica quais certificados estão próximos do vencimento e envia o aviso pelo WhatsApp com antecedência de até 7 dias.</p>
                        </div>
                        <aside className="case-panel" aria-label="Ficha técnica do projeto">
                          <span className="mono">Ficha técnica</span>
                          <dl>
                            {CASE_PANEL.map(r=>(<div key={r.k}><dt>{r.k}</dt><dd>{r.v}</dd></div>))}
                          </dl>
                        </aside>
                      </div>
                    </div>

                    {/* Como funciona */}
                    <div className="case-block">
                      <h3>Como funciona <span className="mono">07 etapas</span></h3>
                      <p className="lede">Da execução agendada até a mensagem enviada. Selecione uma etapa para ver o detalhe.</p>
                      <div className="flow">
                        <div className="flow-rail" aria-hidden="true"><span className="flow-pulse" style={{left:"calc("+(((step+0.5)/FLOW.length)*100).toFixed(3)+"% - 3px)"}}/></div>
                        <div className="flow-nodes" role="tablist" aria-label="Etapas da automação"
                          onKeyDown={(e)=>{
                            if(e.key==="ArrowRight"){ e.preventDefault(); setStep(s=>Math.min(FLOW.length-1,s+1)); }
                            if(e.key==="ArrowLeft"){ e.preventDefault(); setStep(s=>Math.max(0,s-1)); }
                          }}>
                          {FLOW.map((f,i)=>(
                            <button key={f.s} type="button" role="tab" className="flow-node"
                              aria-selected={step===i} aria-controls="flow-detail" id={"flow-tab-"+i}
                              tabIndex={step===i?0:-1} onClick={()=>setStep(i)}>
                              <span className="flow-dot">{String(i+1).padStart(2,"0")}</span>
                              <span className="flow-label">{f.s}</span>
                            </button>
                          ))}
                        </div>
                        <div className="flow-detail" id="flow-detail" role="tabpanel" aria-live="polite" aria-labelledby={"flow-tab-"+step}>
                          <React.Fragment key={step}>
                            <span className="mono">Etapa {String(step+1).padStart(2,"0")} de 07</span>
                            <h3>{FLOW[step].t}</h3>
                            <p>{FLOW[step].d}</p>
                          </React.Fragment>
                        </div>
                      </div>
                    </div>

                    {/* Demonstração */}
                    <div className="case-block">
                      <h3>Demonstração <span className="mono">visual</span></h3>
                      <p className="lede">Exemplo de como o alerta chega. Dados totalmente fictícios: nada é enviado e nenhuma credencial aparece nesta página.</p>
                      <div className="chat">
                        <div className="chat-top">
                          <span className="chat-av" aria-hidden="true">WA</span>
                          <div><b>Alertas de certificados</b><small>mensagem automática · exemplo</small></div>
                        </div>
                        <div className="chat-body">
                          <div className="chat-bubble">
                            <b>Alerta de vencimento</b>
                            {ALERTS.length} certificados vencem nos próximos 7 dias:
                            <ul>
                              {ALERTS.map(a=>(<li key={a.id}><b>{a.id}</b><span>{a.when}</span></li>))}
                            </ul>
                            <p className="chat-foot">Mensagem gerada automaticamente. Exemplo com dados fictícios.</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Desafios técnicos */}
                    <div className="case-block">
                      <h3>Desafios técnicos <span className="mono">05 itens</span></h3>
                      <p className="lede">Os problemas que apareceram durante o desenvolvimento e o que cada um exigiu. Selecione para abrir.</p>
                      <div className="challenges">
                        {CHALLENGES.map((c,i)=>(
                          <div className="challenge" key={c.t} data-open={openCh===i}>
                            <button type="button" aria-expanded={openCh===i} aria-controls={"ch-d-"+i} onClick={()=>setOpenCh(openCh===i?-1:i)}>
                              <span className="ch-n">{String(i+1).padStart(2,"0")}</span>
                              <span className="ch-t">{c.t}</span>
                              <span className="ch-x" aria-hidden="true">+</span>
                            </button>
                            <div className="ch-d" id={"ch-d-"+i} role="region">
                              <p>{c.d}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Tecnologias */}
                    <div className="case-block">
                      <h3>Tecnologias utilizadas <span className="mono">05</span></h3>
                      <div className="tech-grid">
                        {TECHS.map(t=>(
                          <div className="tech" key={t.n}>
                            <span className="mono-tile" aria-hidden="true">{t.m}</span>
                            <b>{t.n}</b>
                            <small>{t.d}</small>
                          </div>
                        ))}
                      </div>
                      <p className="tech-note">As marcas aparecem apenas como ferramentas. Nenhum logo oficial é usado sem autorização e nenhum dado real do ambiente é exposto.</p>
                    </div>

                    {/* Aprendizados */}
                    <div className="case-block">
                      <h3>Aprendizados <span className="mono">05</span></h3>
                      <ol className="principles">
                        {LEARNINGS.map((l,i)=>(
                          <Reveal as="li" key={i} delay={i*70}>
                            <b>0{i+1}</b>
                            <div><p style={{fontSize:"14.5px"}}>{l}</p></div>
                          </Reveal>
                        ))}
                      </ol>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ===== CONTATO ===== */}
            <section id="contato" aria-labelledby="contato-title">
              <div className="wrap">
                <div className="sec">
                  <div className="sec-num" aria-hidden="true">05</div>
                  <div>
                    <div className="sec-head">
                      <MaskTitle text="Entre em contato" id="contato-title"/>
                      <p className="lede">Se quiser falar sobre automação, sistemas ou um processo que pode ser automatizado, escreva. O clique no ícone do e-mail copia o endereço.</p>
                    </div>
                    <div className="contact-list">
                      <button type="button" className="c-item" onClick={copyEmail} aria-label={"Copiar e-mail: "+EMAIL}>
                        <span className="c-ic" aria-hidden="true">{copied ? <Icon d={P.check} s={16}/> : <Icon d={P.mail} s={16}/>}</span>
                        <b>E-mail</b>
                        <small>{copied ? "Copiado ✓" : EMAIL}</small>
                      </button>
                      <a className="c-item" href="https://github.com/wsmelo-dev" target="_blank" rel="noopener noreferrer" aria-label="Abrir o GitHub de Wesley Melo">
                        <span className="c-ic" aria-hidden="true">
                          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                        </span>
                        <b>GitHub</b>
                        <small>github.com/wsmelo-dev</small>
                      </a>
                      <span className="c-item" aria-disabled="true" aria-label="LinkedIn, link em breve">
                        <span className="c-ic" aria-hidden="true">
                          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
                        </span>
                        <b>LinkedIn</b>
                        <small>Perfil em breve</small>
                      </span>
                    </div>
                    <input id="email-fallback" hidden readOnly value={EMAIL}
                      onFocus={(e)=>e.target.select()} aria-label="Endereço de e-mail para copiar manualmente"/>
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer>
            <div className="wrap foot">
              <span>© 2026 Wesley Melo</span>
              <span className="mono status">● helpdesk · automação</span>
              <span className="grow"/>
              <a href="#inicio">Voltar ao topo <span aria-hidden="true">↑</span></a>
            </div>
          </footer>
          </div>

          {toast && <div className="toast" role="status">{toast}</div>}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
